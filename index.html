<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Computer Science Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-toggle">☰</div>
        <ul class="nav-menu">
            <li><a href="#education">Education</a></li>
            <li><a href="#teaching">Teaching</a></li>
            <li><a href="#hobbies">Hobbies</a></li>
            <li><a href="#interests">Interests</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#art">Art</a></li>
            <li><a href="#music">Music</a></li>
            <li><a href="#blogs">Blogs</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>Your Name</h1>
            <p>Computer Science Teacher</p>
        </header>

        <section id="education">
            <h2>Education</h2>
            <!-- Add your education details here -->
        </section>

        <section id="teaching">
            <h2>Teaching</h2>
            <!-- Add your teaching experience here -->
        </section>

        <section id="hobbies">
            <h2>Hobbies</h2>
            <!-- Add your hobbies here -->
        </section>

        <section id="interests">
            <h2>Interests</h2>
            <!-- Add your interests here -->
        </section>

        <section id="skills">
            <h2>Skills</h2>
            <div class="skills-container">
                <div class="skill">
                    <span>HTML</span>
                    <div class="progress-bar"><div class="progress" style="width: 90%"></div></div>
                </div>
                <div class="skill">
                    <span>CSS</span>
                    <div class="progress-bar"><div class="progress" style="width: 85%"></div></div>
                </div>
                <div class="skill">
                    <span>JavaScript</span>
                    <div class="progress-bar"><div class="progress" style="width: 80%"></div></div>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>Projects</h2>
            <div class="project-gallery">
                <div class="project-card">
                    <img src="placeholder.jpg" alt="Project 1">
                    <h3>Project 1</h3>
                    <p>Description</p>
                </div>
                <div class="project-card">
                    <img src="placeholder.jpg" alt="Project 2">
                    <h3>Project 2</h3>
                    <p>Description</p>
                </div>
            </div>
        </section>

        <section id="art">
            <h2>Art</h2>
            <!-- Add your art content here -->
        </section>

        <section id="music">
            <h2>Music</h2>
            <!-- Add your music content here -->
        </section>

        <section id="blogs">
            <h2>Blogs</h2>
            <!-- Add your blog links or content here -->
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
