<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Life Journey Map with Destination List</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }
    #map {
      height: 80vh;
      width: 100vw;
    }
    #controls {
      margin: 10px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #fffbe9;
      z-index: 1100;
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #aaa6;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }
    #yearSlider {
      width: 300px;
      cursor: pointer;
    }
    #yearDisplay {
      font-weight: bold;
      min-width: 80px;
      text-align: center;
    }
    #destination-list {
      position: absolute;
      left: 0;
      bottom: 60px;
      width: 260px;
      max-height: 45vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 0 12px 0 0;
      padding: 12px 18px;
      box-shadow: 2px 0 6px #8883;
      font-size: 0.9em;
      z-index: 1050;
    }
    #destination-list h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-weight: bold;
      color: #185a9d;
    }
    #destinations li {
      color: #777;
      margin-bottom: 8px;
      transition: color 0.3s, background 0.3s;
      padding-left: 7px;
      list-style: none;
      border-left: 4px solid transparent;
    }
    #destinations li.active {
      color: #185a9d;
      background: #dbeffe;
      font-weight: bold;
      border-left-color: #185a9d;
    }
    #footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #222a40;
      color: #ccc;
      font-size: 0.85em;
      padding: 8px 10px;
      text-align: center;
      user-select: none;
      z-index: 1200;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="playBtn">Play</button>
    <input type="range" id="yearSlider" min="0" max="0" value="0" />
    <span id="yearDisplay">Loading...</span>
  </div>

  <div id="map"></div>

  <div id="destination-list">
    <h3>Destinations</h3>
    <ul id="destinations"></ul>
  </div>

  <div id="footer">© 2025 Life Journey Visualization Project. All rights reserved.</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script>
    let map, journeyData = [], markers = [], animInterval = null;

    // Load CSV data (replace the URL or path with your local CSV file path)
    Papa.parse('journey.csv', {
      download: true,
      header: true,
      complete: function(results) {
        journeyData = results.data.filter(r => r.lat && r.lon);
        journeyData.forEach(d => {
          d.lat = parseFloat(d.lat);
          d.lon = parseFloat(d.lon);
          d.year = parseInt(d.year);
          d.age = d.age || ''; // fallback if no age
          d.location = d.location || 'Unknown';
          d.livingWith = d.livingWith || '';
        });
        initMap();
        buildDestinationList();
        setupSlider();
        updateMap(0);
        fitMapBounds();
      }
    });

    function initMap() {
      map = L.map('map').setView([journeyData[0].lat, journeyData[0].lon], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    function updateMap(idx) {
      // Clear existing markers and polylines
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      for (let i = 0; i <= idx; i++) {
        let d = journeyData[i];
        let marker = L.circleMarker([d.lat, d.lon], {
          radius: 7,
          color: '#0066cc',
          fillColor: '#a8e0ff',
          fillOpacity: 0.9
        })
        .bindPopup(`<strong>${d.location} (${d.year})</strong><br>With: ${d.livingWith}`)
        .addTo(map);

        markers.push(marker);

        if (i > 0) {
          let prev = journeyData[i - 1];
          L.polyline([[prev.lat, prev.lon], [d.lat, d.lon]], {color: '#888'}).addTo(map);
        }
      }

      document.getElementById('yearDisplay').textContent =
        journeyData[idx].year + " (Age " + journeyData[idx].age + ")";

      highlightDestinations(idx);
    }

    function buildDestinationList() {
      const ul = document.getElementById('destinations');
      ul.innerHTML = '';
      journeyData.forEach((d, i) => {
        let li = document.createElement('li');
        li.textContent = `${d.year}: ${d.location}`;
        li.id = `dest-${i}`;
        ul.appendChild(li);
      });
    }

    function highlightDestinations(currentIdx) {
      journeyData.forEach((d, i) => {
        const li = document.getElementById(`dest-${i}`);
        if (!li) return;
        if (i <= currentIdx) {
          li.classList.add('active');
        } else {
          li.classList.remove('active');
        }
      });
    }

    function setupSlider() {
      const slider = document.getElementById('yearSlider');
      slider.max = journeyData.length - 1;
      slider.value = 0;
      slider.oninput = function() {
        updateMap(Number(this.value));
        pauseAnimation();
      };
      document.getElementById('playBtn').onclick = togglePlay;
    }

    function togglePlay() {
      if (animInterval) {
        pauseAnimation();
      } else {
        playAnimation();
      }
    }

    function playAnimation() {
      document.getElementById('playBtn').textContent = 'Pause';
      let slider = document.getElementById('yearSlider');
      let idx = Number(slider.value);
      if (idx >= journeyData.length - 1) idx = 0;
      animInterval = setInterval(() => {
        if (idx >= journeyData.length - 1) {
          pauseAnimation();
          return;
        }
        idx++;
        slider.value = idx;
        updateMap(idx);
      }, 1500);
    }

    function pauseAnimation() {
      clearInterval(animInterval);
      animInterval = null;
      document.getElementById('playBtn').textContent = 'Play';
    }

    function fitMapBounds() {
      let latlngs = journeyData.map(d => [d.lat, d.lon]);
      let bounds = L.latLngBounds(latlngs);
      map.fitBounds(bounds, {padding: [30, 30]});
    }
  </script>

</body>
</html>
